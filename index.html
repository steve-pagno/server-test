<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-4">
        <form id="form-cadastro" class="row g-3 align-items-end mb-3">
            <div class="col-auto">
                <label for="name" class="form-label">Nome</label>
                <input type="text" id="name" name="name" class="form-control">
            </div>

            <div class="col-auto">
                <label for="email" class="form-label">Email</label>
                <input type="email" name="email" id="email" class="form-control">
            </div>

            <div class="col-auto">
                <input type="submit" value="Cadastrar" class="btn btn-primary">
            </div>
        </form>

        <div id="mensagem-cadastro" class="alert d-none" role="alert"></div>

        <hr>

        <h2>Usuários Cadastrados</h2>
        <ul id="lista-usuarios" class="list-group">
            <!-- O JavaScript vai injetar os itens (li) aqui dentro -->
        </ul>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Função que busca os dados e monta a lista na tela
        async function carregarUsuarios() {
            try {
                // Faz a requisição para a rota que criamos no Node
                const resposta = await fetch('/usuarios');
                const usuarios = await resposta.json();
                
                const listaHtml = document.getElementById('lista-usuarios');
                listaHtml.innerHTML = ''; // Limpa a lista antes de preencher
                
                // O laço de repetição (for) para passar por cada usuário
                for (let i = 0; i < usuarios.length; i++) {
                    const usuario = usuarios[i]; // Pega o usuário atual da lista
                    
                    // Cria um elemento <li> para o HTML
                    const itemLista = document.createElement('li');
                    itemLista.className = 'list-group-item';
                    itemLista.textContent = `Nome: ${usuario.name} | Email: ${usuario.email}`;
                    
                    // Adiciona o <li> dentro da <ul>
                    listaHtml.appendChild(itemLista);
                }
            } catch (erro) {
                console.error("Erro ao carregar a lista:", erro);
            }
        }

        // Chama a função assim que a página é aberta
        carregarUsuarios();

        // Mostra uma mensagem de sucesso ou erro sem sair da página
        function mostrarMensagem(texto, tipo) {
            const caixaMensagem = document.getElementById('mensagem-cadastro');
            caixaMensagem.textContent = texto;
            caixaMensagem.className = `alert alert-${tipo}`;
        }

        // Intercepta o envio do formulário para cadastrar via fetch, sem recarregar a página
        document.getElementById('form-cadastro').addEventListener('submit', async (evento) => {
            evento.preventDefault();

            const formulario = evento.target;
            const name = formulario.name.value;
            const email = formulario.email.value;

            try {
                const resposta = await fetch('/cadastrar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email })
                });

                const dados = await resposta.json();

                if (!resposta.ok) {
                    mostrarMensagem(dados.erro || 'Erro ao cadastrar usuário', 'danger');
                    return;
                }

                mostrarMensagem(dados.mensagem, 'success');
                formulario.reset();
                carregarUsuarios();
            } catch (erro) {
                console.error('Erro ao cadastrar:', erro);
                mostrarMensagem('Erro ao cadastrar usuário', 'danger');
            }
        });
    </script>
</body>
</html>
