<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-4">
        <form action="/cadastrar" method="post" class="row g-3 align-items-end mb-4">
            <div class="col-auto">
                <label for="name" class="form-label">Nome</label>
                <input type="text" id="name" name="name" class="form-control">
            </div>

            <div class="col-auto">
                <label for="email" class="form-label">Email</label>
                <input type="email" name="email" id="email" class="form-control">
            </div>

            <div class="col-auto">
                <input type="submit" value="Cadastrar" class="btn btn-primary">
            </div>
        </form>

        <hr>

        <h2>Usuários Cadastrados</h2>
        <ul id="lista-usuarios" class="list-group">
            <!-- O JavaScript vai injetar os itens (li) aqui dentro -->
        </ul>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Função que busca os dados e monta a lista na tela
        async function carregarUsuarios() {
            try {
                // Faz a requisição para a rota que criamos no Node
                const resposta = await fetch('/usuarios');
                const usuarios = await resposta.json();
                
                const listaHtml = document.getElementById('lista-usuarios');
                listaHtml.innerHTML = ''; // Limpa a lista antes de preencher
                
                // O laço de repetição (for) para passar por cada usuário
                for (let i = 0; i < usuarios.length; i++) {
                    const usuario = usuarios[i]; // Pega o usuário atual da lista
                    
                    // Cria um elemento <li> para o HTML
                    const itemLista = document.createElement('li');
                    itemLista.className = 'list-group-item';
                    itemLista.textContent = `Nome: ${usuario.name} | Email: ${usuario.email}`;
                    
                    // Adiciona o <li> dentro da <ul>
                    listaHtml.appendChild(itemLista);
                }
            } catch (erro) {
                console.error("Erro ao carregar a lista:", erro);
            }
        }

        // Chama a função assim que a página é aberta
        carregarUsuarios();
    </script>
</body>
</html>
